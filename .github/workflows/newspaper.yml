# briarPipe — reference host adapter.
#
# This is ONE way to run briarPipe; the core `run.py` is host-agnostic. The job
# runs daily and `run.py` decides whether an edition is actually due based on your
# config's `frequency`. Results are committed back to the repo via the git store.
#
# Setup: add your provider key (and any SMTP_* secrets) under
# Settings → Secrets and variables → Actions.
name: newspaper

on:
  schedule:
    - cron: "0 13 * * *"   # daily ~13:00 UTC; frequency gating happens in run.py
  workflow_dispatch:        # run on demand from the Actions tab

permissions:
  contents: write           # needed to commit editions + state back

concurrency:
  group: newspaper
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Curate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional email delivery — only needed if delivery.gateway is "email":
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python run.py --store git
