# briarPipe configuration — be your own newsboy!
#
# This is the single config for your paper. Edit it by hand, or generate it with
# the form (run ./install.sh, or open form/index.html). It's safe to commit.
#
# Secrets (AI key, SMTP creds) do NOT go in this file. Keep the `secrets:` block
# at the bottom empty/commented and provide them through the environment instead:
#   • Locally:        export LLM_API_KEY=... (or a .env, or your shell profile)
#   • GitHub Actions: add them as repo Actions secrets (Settings → Secrets)
# The environment always wins, so the same committed config works everywhere —
# just leave the sensitive bits out of the file and set them as secrets.

# What you want your paper to cover. Free text + optional topic tags; the more
# specific, the better the curation.
interests: |
  Self-hosted software, the indie web, and small-scale open source.
  Especially: tools that respect user ownership of their data.
topics:
  - self-hosting
  - open source
  - indie web

# How often a new edition is published: daily | weekly | monthly.
# This is config-driven — the host only needs to invoke run.py on some regular
# tick (e.g. daily); briarPipe decides whether an edition is actually due.
frequency: weekly

language: en
timezone: America/New_York
edition_name: The Daily Briar

# Token budget. `max_per_run` caps total model spend for a single edition.
# `cultivation_fraction` is the slice spent growing/pruning your source base
# (the rest goes to curating the actual paper). Default ~1/5.
token_budget:
  max_per_run: 120000
  cultivation_fraction: 0.2

# First-run seeds. When the source base is empty, briarPipe discovers feeds from
# these sites to get you started. After that the base maintains itself.
bootstrap_sources:
  - https://news.ycombinator.com/
  - https://lobste.rs/

# Which AI writes your paper — bring your own. `base_url` is any OpenAI-compatible
# endpoint (OpenAI, OpenRouter, Groq, Together, Mistral, DeepSeek, a local Ollama,
# or Anthropic's OpenAI-compatible endpoint). The key is read from the env var named
# by `api_key_env`, never inline here.
provider:
  name: openai-compatible
  base_url: https://api.openai.com/v1   # e.g. https://openrouter.ai/api/v1, http://localhost:11434/v1
  model: gpt-4o-mini                    # whatever model your endpoint serves
  api_key_env: LLM_API_KEY              # env var holding your key

# How the finished edition reaches you. A dated Markdown file is ALWAYS written
# to editions/. Configure an extra gateway here for push delivery.
delivery:
  gateway: email          # email = send it | markdown = no delivery, file only
  to: you@example.com
  # Optional: when running on your OWN machine (laptop/cron/Docker — not GitHub
  # Actions or any cloud/CI), also drop a copy of each edition here as
  # <date>.md. '~' is expanded. Skipped automatically on CI/cloud, so it's safe
  # to commit. Independent of the gateway above — email AND save a copy if you
  # like. The canonical edition still lands in editions/ either way.
  # save_to: ~/Documents/briarpipe

# Shape of each edition.
output:
  max_stories: 12
  sections:
    - Headlines
    - Deep Dive
    - Worth a Click
  summary_length: medium  # short | medium | long

# Voice of your AI editor. Free text — write it however you'd enjoy reading it.
# e.g. "funny", "relaxed and conversational", "stiff & formal", "80's radio DJ".
style: relaxed and curious, with a dry sense of humor

# ─────────────────────────────────────────────────────────────────────────────
# Secrets — leave these OUT of the committed file. Set them as environment
# variables instead (locally) or as GitHub Actions secrets (in CI):
#   LLM_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
#
# For a quick local-only setup you MAY uncomment and fill the block below — but
# then do NOT commit those values. The environment always overrides anything here.
#
# secrets:
#   api_key: sk-...                   # -> LLM_API_KEY (your AI provider key)
#   smtp_host: smtp.example.com       # -> SMTP_HOST   (email gateway)
#   smtp_port: 587                    # -> SMTP_PORT
#   smtp_user: you@example.com        # -> SMTP_USER
#   smtp_password: app-password       # -> SMTP_PASS
#   smtp_from: you@example.com        # -> SMTP_FROM
